<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Sanctions</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1c1c24;
            --text-main: #ffffff;
            --text-muted: #8b8b99;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 1rem;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            background-color: #2a2a35;
            image-rendering: pixelated;
        }

        .player-info h2 {
            margin: 0;
            font-size: 1.3rem;
            /* La couleur est gérée en JS */
        }

        .uuid-text {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: monospace;
            margin-top: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .priority-badge {
            background: #333;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #fff;
        }

        .loader {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-size: 1.2rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <h1>🔨 Liste des Sanctions</h1>
    
    <div class="container" id="player-container">
        <div class="loader" id="loader">Chargement des données depuis GitHub...</div>
    </div>

    <script>
        // 1. Fonction pour charger le fichier data.json
        async function loadJsonData() {
            try {
                // Sur GitHub Pages, il va chercher le fichier situé à côté de l'index.html
                const response = await fetch('data.json');
                if (!response.ok) throw new Error("Impossible de lire data.json");
                return await response.json();
            } catch (error) {
                console.error("Erreur:", error);
                document.getElementById('loader').innerHTML = "❌ Erreur : Impossible de charger le fichier data.json. Vérifie qu'il est bien sur ton GitHub.";
                return null;
            }
        }

        // 2. Fonction pour récupérer le pseudo sans bloquer le reste du site
        async function fetchPlayerName(uuid, elementId) {
            try {
                // Utilisation de l'API PlayerDB, très fiable pour les sites statiques (CORS)
                const response = await fetch(`https://playerdb.co/api/player/minecraft/${uuid}`);
                if (!response.ok) throw new Error("Joueur non trouvé");
                const data = await response.json();
                
                // On met à jour le texte avec le pseudo trouvé
                document.getElementById(elementId).innerText = data.data.player.username;
            } catch (error) {
                document.getElementById(elementId).innerText = "Pseudo Inconnu";
            }
        }

        // 3. Fonction principale d'affichage
        async function renderDashboard() {
            const container = document.getElementById('player-container');
            const loader = document.getElementById('loader');
            
            // On récupère la liste du fichier json
            const playersList = await loadJsonData();
            if (!playersList) return; // Si erreur, on arrête là

            // On retire le texte de chargement
            loader.style.display = 'none';

            // On boucle sur chaque joueur du JSON
            playersList.forEach((player, index) => {
                
                // Identifiant unique pour mettre à jour le pseudo plus tard
                const pseudoElementId = `pseudo-${index}`;
                // Tête du joueur
                const avatarUrl = `https://minotar.net/helm/${player.uuid}/50.png`;

                // On crée la carte HTML avec la couleur personnalisée et le pseudo en "Chargement..."
                const cardHTML = `
                    <div class="card">
                        <div class="header">
                            <img src="${avatarUrl}" alt="Avatar" class="avatar" onerror="this.src='https://minotar.net/helm/steve/50.png'">
                            <div class="player-info">
                                <h2 id="${pseudoElementId}" style="color: ${player.couleur};">Chargement...</h2>
                                <div class="uuid-text">${player.uuid}</div>
                            </div>
                        </div>

                        <div class="info-row">
                            <span class="info-label">Raison</span>
                            <span style="text-align: right;">${player.raison}</span>
                        </div>

                        <div class="info-row" style="margin-top: 0.5rem;">
                            <span class="info-label">Priorité</span>
                            <span class="priority-badge">${player.priorite}</span>
                        </div>
                    </div>
                `;

                // On insère la carte sur la page immédiatement
                container.insertAdjacentHTML('beforeend', cardHTML);

                // On lance la recherche du pseudo en arrière-plan
                fetchPlayerName(player.uuid, pseudoElementId);
            });
        }

        // On lance la fonction dès que la page est lue par le navigateur
        renderDashboard();
    </script>
</body>
</html>
