<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Sanctions</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1c1c24;
            --text-main: #ffffff;
            --text-muted: #8b8b99;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 1rem;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            background-color: #2a2a35;
            image-rendering: pixelated; /* Pour garder le style Minecraft net */
        }

        .player-info h2 {
            margin: 0;
            font-size: 1.3rem;
            /* La couleur sera injectée ici en JS */
        }

        .uuid-text {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: monospace;
            margin-top: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .priority-badge {
            background: #333;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .loader {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-size: 1.2rem;
            margin-top: 2rem;
        }

    </style>
</head>
<body>

    <h1>🔨 Liste des Sanctions</h1>
    <div class="container" id="player-container">
        <div class="loader" id="loader">Chargement des joueurs depuis GitHub...</div>
    </div>

    <script>
        // Fonction pour récupérer les données du fichier data.json
        async function loadJsonData() {
            try {
                // Sur GitHub Pages, ceci ira chercher le fichier data.json à la racine de ton site
                const response = await fetch('data.json');
                if (!response.ok) throw new Error("Erreur de chargement du JSON");
                return await response.json();
            } catch (error) {
                console.error("Erreur:", error);
                document.getElementById('loader').innerHTML = "Erreur : Impossible de charger data.json.";
                return null;
            }
        }

        // Fonction pour récupérer le pseudo via l'API Mojang (Ashcon)
        async function fetchPlayerName(uuid) {
            try {
                const cleanUuid = uuid.replace(/-/g, '');
                const response = await fetch(`https://api.ashcon.app/mojang/v2/user/${cleanUuid}`);
                if (!response.ok) throw new Error("Joueur non trouvé");
                const data = await response.json();
                return data.username;
            } catch (error) {
                return "Pseudo Inconnu";
            }
        }
