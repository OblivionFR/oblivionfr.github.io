<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Sanctions</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1c1c24;
            --text-main: #ffffff;
            --text-muted: #8b8b99;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 1rem;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            background-color: #2a2a35;
            image-rendering: pixelated;
        }

        .player-info h2 {
            margin: 0;
            font-size: 1.3rem;
        }

        .uuid-text {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: monospace;
            margin-top: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
        }

        .info-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .priority-badge {
            background: #333;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            color: #fff;
        }

        .loader {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-size: 1.2rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <h1>🔨 Liste des Sanctions</h1>
    
    <div class="container" id="player-container">
        <div class="loader" id="loader">Chargement du fichier depuis GitHub...</div>
    </div>

    <script>
        // 1. Charger le fichier JSON
        async function loadJsonData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/OblivionFR/oblivionfr.github.io/refs/heads/main/kill_list/data.json');
                if (!response.ok) throw new Error("Impossible de lire le fichier");
                return await response.json();
            } catch (error) {
                document.getElementById('loader').innerHTML = "❌ Erreur : Impossible de charger le fichier data.json.";
                return null;
            }
        }

        // 2. Fonction pour récupérer le TOUT DERNIER pseudo via Ashcon (Proxy Mojang en temps réel)
        async function fetchPlayerName(uuid) {
            try {
                const cleanUuid = uuid.replace(/-/g, '');
                const response = await fetch(`https://api.ashcon.app/mojang/v2/user/${cleanUuid}`);
                if (!response.ok) return "Pseudo Inconnu";
                const data = await response.json();
                return data.username;
            } catch (error) {
                return "Pseudo Inconnu";
            }
        }

        // 3. Fonction principale pour tout traiter
        async function renderDashboard() {
            const container = document.getElementById('player-container');
            const loader = document.getElementById('loader');
            
            // Étape A: Récupération du JSON
            let playersList = await loadJsonData();
            if (!playersList) return;

            // Étape B: On prévient l'utilisateur que ça télécharge les pseudos
            loader.innerText = "Récupération des derniers pseudos Mojang en cours...";

            // Étape C: On récupère TOUS les pseudos de manière simultanée
            const fetchPromises = playersList.map(async (player) => {
                player.username = await fetchPlayerName(player.uuid);
                return player;
            });

            // On attend que tous les pseudos soient trouvés
            playersList = await Promise.all(fetchPromises);

            // Étape D: Tri des joueurs
            playersList.sort((a, b) => {
                // 1. On trie par priorité d'abord (Priorité 1 en premier, puis 2, etc.)
                if (a.priorite !== b.priorite) {
                    return a.priorite - b.priorite; 
                }
                
                // 2. Si la priorité est la même, on trie par pseudo alphabétiquement (A -> Z)
                return a.username.toLowerCase().localeCompare(b.username.toLowerCase());
            });

            // Étape E: On efface le loader et on génère les cartes triées
            loader.style.display = 'none';

            let cardsHTML = '';
            playersList.forEach((player) => {
                // Image de la tête à jour
                const avatarUrl = `https://minotar.net/helm/${player.uuid}/50.png`;

                cardsHTML += `
                    <div class="card">
                        <div class="header">
                            <img src="${avatarUrl}" alt="Avatar" class="avatar" onerror="this.src='https://minotar.net/helm/steve/50.png'">
                            <div class="player-info">
                                <h2 style="color: ${player.couleur};">${player.username}</h2>
                                <div class="uuid-text">${player.uuid}</div>
                            </div>
                        </div>

                        <div class="info-row">
                            <span class="info-label">Raison</span>
                            <span style="text-align: right; color: var(--text-main); font-size: 0.9rem;">${player.raison}</span>
                        </div>

                        <div class="info-row" style="margin-top: 0.5rem;">
                            <span class="info-label">Priorité</span>
                            <span class="priority-badge">${player.priorite}</span>
                        </div>
                    </div>
                `;
            });

            // On injecte tout sur la page web
            container.innerHTML = cardsHTML;
        }

        // Démarrage du script
        renderDashboard();
    </script>
</body>
</html>
